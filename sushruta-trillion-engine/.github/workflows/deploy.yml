name: Sushruta-Trillion CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Unit & Boundary Testing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx flake8

      - name: Static Code Analysis & Syntax Validation
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.git,__pycache__

      - name: Run 100-Trial Automated Boundary Diagnostic Suite
        run: |
          python tests/batch_tester.py

      - name: Execute Full Pytest Test Suite
        run: |
          pytest -v --tb=short tests/

  docker-build-and-verify:
    name: Docker Build & Container Health Probe
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t sushruta-trillion-engine:ci-test .

      - name: Test Container Boot & Health Probe
        run: |
          docker run -d --name sushruta_test_runner -p 8000:8000 sushruta-trillion-engine:ci-test
          sleep 4
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "FAILED")
          echo "Health check HTTP response code: $HEALTH_STATUS"
          if [ "$HEALTH_STATUS" != "200" ]; then
            docker logs sushruta_test_runner
            exit 1
          fi
          echo "✅ Container passed healthcheck with HTTP 200 OK!"
          docker stop sushruta_test_runner
          docker rm sushruta_test_runner
